services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: hire_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: bjx2005123
      MYSQL_DATABASE: hire_system
      MYSQL_USER: hire_user
      MYSQL_PASSWORD: hire_password
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Hirebackend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Hirebackend/src/main/resources/job_application_schema.sql:/docker-entrypoint-initdb.d/02-job_application.sql
      - ./Hirebackend/src/main/resources/interview_schema.sql:/docker-entrypoint-initdb.d/03-interview.sql
      - mysql_data:/var/lib/mysql  # 添加这行！数据持久化
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    networks:
      - hire_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: hire_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - hire_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 Spring Boot 服务
  backend:
    build:
      context: ./Hirebackend
      dockerfile: Dockerfile
    container_name: hire_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hire_system?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: bjx2005123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8094
    ports:
      - "8094:8094"
    volumes:
      - backend_logs:/app/logs
    networks:
      - hire_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8094/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 前端 Vue 服务 (使用 Nginx)
  frontend:
    build:
      context: ./Hirefrontend
      dockerfile: Dockerfile
      args:
        VUE_APP_API_BASE_URL: http://localhost:8094
    container_name: hire_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - hire_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  hire_network:
    driver: bridge
